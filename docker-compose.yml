services:
  quillbot-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quillbot-automation
    environment:
      - QUILLBOT_EMAIL=${QUILLBOT_EMAIL}
      - QUILLBOT_PASSWORD=${QUILLBOT_PASSWORD}
      - HEADLESS=true
      - PORT=3090
      - BROWSER_DATA_DIR=/app/browser-data
      - SESSIONS_DIR=/app/sessions
    expose:
      - 3090
    restart: unless-stopped
    # Add shared memory size for Chrome stability
    shm_size: "2gb"
    # Security options for running Chrome in container
    cap_add:
      - SYS_ADMIN
    # Persistent storage for session data
    volumes:
      - browser-data:/app/browser-data
      - sessions-data:/app/sessions

volumes:
  browser-data:
  sessions-data:
